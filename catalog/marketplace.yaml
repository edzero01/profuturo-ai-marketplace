apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: profuturo
  title: Marketplace Profuturo
  description: Marketplace de plugins de Claude Code de Profuturo. Los repos lo activan
    desde .claude/settings.json.
  annotations:
    backstage.io/source-location: url:https://github.com/edzero01/profuturo-ai-marketplace/tree/main/
  links:
  - url: https://github.com/edzero01/profuturo-ai-marketplace
    title: Repositorio
spec:
  type: marketplace
  lifecycle: experimental
  owner: group:default/guests
  system: ai-tooling
  version: 1.1.0
  plugins:
