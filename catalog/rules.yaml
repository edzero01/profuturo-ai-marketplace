apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: regla-capas-microservicio
  title: Capas del microservicio
  description: Separación controllers / services / clients / repositories / beans
    en la capa Experience
  annotations:
    backstage.io/source-location: url:https://github.com/edzero01/profuturo-ai-marketplace/blob/main/plugins/profuturo-java/skills/reglas-profuturo/rules/capas-microservicio.md
spec:
  type: rule
  lifecycle: experimental
  owner: group:default/guests
  system: ai-tooling
  category: architecture
  disciplines:
  - backend
  rationale: Mantener las capas separadas permite cambiar un backend sin tocar el
    contrato que consumen los canales.
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: regla-secretos-y-configuracion
  title: Secretos y configuración
  description: Ninguna credencial en Git; configuración por variables de entorno y
    Secrets de Kubernetes
  annotations:
    backstage.io/source-location: url:https://github.com/edzero01/profuturo-ai-marketplace/blob/main/plugins/profuturo-java/skills/reglas-profuturo/rules/secretos-y-configuracion.md
spec:
  type: rule
  lifecycle: experimental
  owner: group:default/guests
  system: ai-tooling
  category: security
  disciplines:
  - backend
  - devops
  rationale: Profuturo maneja información financiera y personal; un secreto en Git
    queda en el historial aunque se borre.
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: regla-oracle-jpa
  title: Oracle y JPA
  description: Consultas parametrizadas, sin SELECT *, paginación y esquema gestionado
    por el equipo de base de datos
  annotations:
    backstage.io/source-location: url:https://github.com/edzero01/profuturo-ai-marketplace/blob/main/plugins/profuturo-java/skills/reglas-profuturo/rules/oracle-jpa.md
spec:
  type: rule
  lifecycle: experimental
  owner: group:default/guests
  system: ai-tooling
  category: data
  disciplines:
  - backend
  rationale: Los esquemas Oracle 19c se comparten con otras aplicaciones y los controla
    el equipo de base de datos.
